# 構成③：入口の判定 → 準備 → AI（スキル）→ 投稿。
# 3構成は、リポジトリの変数 TRIAGE_ARM で、1つだけ有効にする（gh variable set TRIAGE_ARM --body 3）。
name: Triage 3 (harness)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: triage-3-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      ${{ vars.TRIAGE_ARM == '3'
      && github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CONTROL_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate
        id: gate
        run: bash scripts/gate.sh

      - name: Prepare
        if: steps.gate.outputs.state == 'post_target'
        run: bash scripts/prepare.sh

      # 分析（AI）：読むのは evidence/ だけ、書くのは triage/result.json だけ。Bashは使わせない
      - name: Analyze (AI)
        if: steps.gate.outputs.state == 'post_target'
        continue-on-error: true
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ vars.TRIAGE_BREAK_AI == '1' && 'invalid-dummy-token' || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ci-failure-triage スキルに従って、evidence/ の失敗を調べ、triage/result.json を書いてください。
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 10
            --allowedTools "Skill,Read(evidence/**),Edit(triage/result.json)"
            --disallowedTools "Bash,WebFetch,WebSearch"
          display_report: "false"
          show_full_output: "false"

      - name: Post
        if: always() && steps.gate.outputs.state == 'post_target'
        run: bash scripts/post.sh
