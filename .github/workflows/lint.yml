# 自己検証：ワークフローの検証（actionlint）と、スキーマの検証。
# 注意：未検証のたたき台。GitHubへのpush前に、内容を確認すること。
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # actionlint v1.7.12 は Go 1.25 以上が必要（go.mod は 1.23 のまま）
          go-version: "1.25"

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Validate schemas
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install jsonschema
          python scripts/validate_schemas.py

      - name: Script tests (gate.sh, post.sh)
        run: bash tests/run.sh

      - name: Article version core tests (article/)
        run: |
          python3 -m venv .venv-article
          . .venv-article/bin/activate
          pip install check-jsonschema
          ARTICLE=1 SCRIPTS_DIR="$PWD/article" CORE=1 bash tests/run.sh
